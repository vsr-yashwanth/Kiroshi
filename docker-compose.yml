version: '3.8'

services:
  # Primary Relational & Geospatial Storage (PostGIS)
  db:
    image: postgis/postgis:16-3.4
    container_name: kiroshi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-kiroshi}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/init-postgis.sh:/docker-entrypoint-initdb.d/init-postgis.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kiroshi"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Backend Application Service
  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.backend
    container_name: kiroshi-backend
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-kiroshi}
      SECRET_KEY: ${SECRET_KEY:-production-secret-key-change-in-env-file-0123456789}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      LOG_LEVEL: INFO
      LOG_FORMAT: json
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
