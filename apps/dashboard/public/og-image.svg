<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Subtle grid lines -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.4">
    <line x1="100" y1="0" x2="100" y2="630" />
    <line x1="300" y1="0" x2="300" y2="630" />
    <line x1="500" y1="0" x2="500" y2="630" />
    <line x1="700" y1="0" x2="700" y2="630" />
    <line x1="900" y1="0" x2="900" y2="630" />
    <line x1="1100" y1="0" x2="1100" y2="630" />
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="250" x2="1200" y2="250" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="550" x2="1200" y2="550" />
  </g>

  <!-- Shield Badge -->
  <g transform="translate(100, 140)">
    <circle cx="60" cy="60" r="55" fill="rgba(239, 68, 68, 0.15)" stroke="#ef4444" stroke-width="2" filter="url(#glow)" />
    <path d="M60 25 L90 38 V65 C90 85 60 100 60 100 C60 100 30 85 30 65 V38 Z" fill="#ef4444" stroke="#ffffff" stroke-width="2" />
    <path d="M50 62 L57 69 L72 52" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Title & Branding -->
  <text x="240" y="195" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="64" font-weight="800" fill="#ffffff" letter-spacing="2">
    KIROSHI
  </text>
  <text x="540" y="180" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#ef4444" letter-spacing="1">
    COMMAND CONSOLE v0.4
  </text>

  <!-- Subtitle -->
  <text x="100" y="320" font-family="'Outfit', system-ui, sans-serif" font-size="34" font-weight="600" fill="#f1f5f9">
    Smart Tourist Safety Monitoring &amp; Rapid Incident Response
  </text>
  <text x="100" y="375" font-family="system-ui, sans-serif" font-size="22" font-weight="400" fill="#94a3b8">
    Autonomous Risk Engine • Real-Time Geospatial Telemetry • Mission-Critical SOS Dispatch
  </text>

  <!-- Status badges -->
  <g transform="translate(100, 440)">
    <!-- Badge 1 -->
    <rect x="0" y="0" width="220" height="50" rx="25" fill="rgba(16, 185, 129, 0.12)" stroke="#10b981" stroke-width="1.5" />
    <circle cx="28" cy="25" r="6" fill="#10b981" />
    <text x="46" y="32" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#10b981">SYSTEM HEALTHY</text>

    <!-- Badge 2 -->
    <rect x="240" y="0" width="250" height="50" rx="25" fill="rgba(59, 130, 246, 0.12)" stroke="#3b82f6" stroke-width="1.5" />
    <text x="268" y="32" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#60a5fa">POSTGIS 16 GEOSPATIAL</text>

    <!-- Badge 3 -->
    <rect x="510" y="0" width="250" height="50" rx="25" fill="rgba(245, 158, 11, 0.12)" stroke="#f59e0b" stroke-width="1.5" />
    <text x="538" y="32" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#fbbf24">LIVE TELEMETRY STREAM</text>
  </g>

  <!-- Bottom Accent bar -->
  <rect x="0" y="620" width="1200" height="10" fill="url(#accentGrad)" />
</svg>
