name: KIROSHI CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    name: Backend Lint & Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: kiroshi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Alembic migrations on PostGIS
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:password@localhost:5432/kiroshi_test
          PYTHONPATH: backend
        run: |
          cd backend
          alembic upgrade head
          cd ..

      - name: Run pytest
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:password@localhost:5432/kiroshi_test
          PYTHONPATH: .
        run: |
          python -m pytest backend/tests -v

  dashboard-build:
    name: Dashboard Build & Verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck & Build
        run: npm run build
