name: Build & Release Mobile APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Generate Android Platform Files
        working-directory: apps/mobile
        run: |
          flutter create --org org.kiroshi --platforms=android .

      - name: Patch Android SDK Versions
        working-directory: apps/mobile
        run: |
          # Set explicit SDK versions so geolocator_android can resolve them
          APP_GRADLE="android/app/build.gradle"

          # Replace flutter.compileSdkVersion references (Groovy DSL style)
          sed -i 's/compileSdkVersion flutter\.compileSdkVersion/compileSdkVersion 35/g' "$APP_GRADLE"
          sed -i 's/compileSdk = flutter\.compileSdkVersion/compileSdk = 35/g' "$APP_GRADLE"
          sed -i 's/minSdkVersion flutter\.minSdkVersion/minSdkVersion 21/g' "$APP_GRADLE"
          sed -i 's/minSdk = flutter\.minSdkVersion/minSdk = 21/g' "$APP_GRADLE"
          sed -i 's/targetSdkVersion flutter\.targetSdkVersion/targetSdkVersion 35/g' "$APP_GRADLE"
          sed -i 's/targetSdk = flutter\.targetSdkVersion/targetSdk = 35/g' "$APP_GRADLE"

          # Enable AndroidX
          echo "" >> android/gradle.properties
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties

          echo "=== android/app/build.gradle ==="
          cat "$APP_GRADLE"
          echo "=== android/gradle.properties ==="
          cat android/gradle.properties

      - name: Install Flutter Dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Build Android Release APK
        working-directory: apps/mobile
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kiroshi-mobile-release
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: apps/mobile/build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
