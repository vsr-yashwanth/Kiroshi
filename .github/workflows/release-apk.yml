name: Build & Release Mobile APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: false

      - name: Write local.properties
        working-directory: apps/mobile/android
        run: |
          # Flutter SDK root is two levels above the flutter binary
          FLUTTER_SDK=$(dirname $(dirname $(which flutter)))
          echo "flutter.sdk=${FLUTTER_SDK}" > local.properties
          echo "sdk.dir=${ANDROID_SDK_ROOT}" >> local.properties
          cat local.properties

      - name: Install Flutter Dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Build Android Debug APK
        working-directory: apps/mobile
        run: flutter build apk --debug

      - name: Rename APK with version info
        run: |
          VERSION="${GITHUB_REF_NAME:-v1.0.0}"
          if [[ "${VERSION}" == "main" || "${VERSION}" == "dev" ]]; then
            VERSION="v1.0.0"
          fi
          mkdir -p releases
          cp apps/mobile/build/app/outputs/flutter-apk/app-debug.apk \
             releases/kiroshi-${VERSION}.apk
          echo "APK_NAME=kiroshi-${VERSION}.apk" >> $GITHUB_ENV
          echo "RELEASE_TAG=${VERSION}" >> $GITHUB_ENV

      - name: Upload APK as Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kiroshi-mobile-apk
          path: releases/${{ env.APK_NAME }}
          retention-days: 30

      - name: Attach APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: releases/${{ env.APK_NAME }}
          name: "KIROSHI ${{ env.RELEASE_TAG }} — Production Release"
          draft: false
          prerelease: false
          body: |
            ## KIROSHI Mobile Client — ${{ env.RELEASE_TAG }}

            ### 📱 Android Installation Guide
            1. Download **`${{ env.APK_NAME }}`** from the Assets below.
            2. On your Android device, enable **Install unknown apps** for your browser / Files app.
            3. Open the APK file and tap **Install**.

            ---
            *Built automatically via GitHub Actions CI/CD.*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


