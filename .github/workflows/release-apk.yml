name: Build & Release Mobile APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Create Flutter Project Platform Files
        working-directory: apps/mobile
        run: |
          flutter create --org org.kiroshi --platforms=android .
          # Ensure subprojects and plugins receive compileSdk and targetSdk configuration
          echo "" >> android/build.gradle
          echo "subprojects {" >> android/build.gradle
          echo "    afterEvaluate { project ->" >> android/build.gradle
          echo "        if (project.hasProperty('android')) {" >> android/build.gradle
          echo "            project.android {" >> android/build.gradle
          echo "                if (namespace == null) {" >> android/build.gradle
          echo "                    namespace project.group" >> android/build.gradle
          echo "                }" >> android/build.gradle
          echo "                compileSdkVersion 34" >> android/build.gradle
          echo "                defaultConfig {" >> android/build.gradle
          echo "                    targetSdkVersion 34" >> android/build.gradle
          echo "                }" >> android/build.gradle
          echo "            }" >> android/build.gradle
          echo "        }" >> android/build.gradle
          echo "    }" >> android/build.gradle
          echo "}" >> android/build.gradle

      - name: Install Flutter Dependencies
        working-directory: apps/mobile
        run: |
          flutter clean
          flutter pub get

      - name: Build Android Release APK
        working-directory: apps/mobile
        run: |
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kiroshi-mobile-release
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: apps/mobile/build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
