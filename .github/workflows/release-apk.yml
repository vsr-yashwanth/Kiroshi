name: Build & Release Mobile APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: false

      - name: Write local.properties
        working-directory: apps/mobile/android
        run: |
          # Flutter SDK root is two levels above the flutter binary
          FLUTTER_SDK=$(dirname $(dirname $(which flutter)))
          echo "flutter.sdk=${FLUTTER_SDK}" > local.properties
          echo "sdk.dir=${ANDROID_SDK_ROOT}" >> local.properties
          cat local.properties

      - name: Install Flutter Dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Build Android Debug APK
        working-directory: apps/mobile
        run: flutter build apk --debug

      - name: Rename APK with version info
        run: |
          VERSION="${GITHUB_REF_NAME:-dev}"
          mkdir -p releases
          cp apps/mobile/build/app/outputs/flutter-apk/app-debug.apk \
             releases/kiroshi-${VERSION}.apk
          echo "APK_NAME=kiroshi-${VERSION}.apk" >> $GITHUB_ENV

      - name: Commit APK to releases/ folder
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add releases/
          git diff --cached --quiet || git commit -m "chore(release): add APK build for ${GITHUB_REF_NAME:-dev} [skip ci]"
          git push origin HEAD:main || echo "Push skipped (detached HEAD on tag build)"

      - name: Upload APK as Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kiroshi-mobile-debug
          path: releases/${{ env.APK_NAME }}
          retention-days: 30

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: releases/${{ env.APK_NAME }}
          name: "Kiroshi ${{ github.ref_name }}"
          body: |
            ## Kiroshi Mobile App — ${{ github.ref_name }}

            ### 📱 Installation
            1. Download `${{ env.APK_NAME }}` below
            2. On your Android phone, go to **Settings → Install unknown apps** and allow your browser/Files app
            3. Open the downloaded APK and tap **Install**

            > **Note:** This is a debug build for testing. Production signing will be added in a future release.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

